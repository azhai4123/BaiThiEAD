spring.application.name=sis
server.port=8080

# Database Configuration (MySQL on Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/sis?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/,file:ui-prototype/

