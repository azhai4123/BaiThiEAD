<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for the edit icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Top Banner Header -->
        <header class="main-header">
            <h1>Student Information System</h1>
        </header>

        <!-- Sub Title -->
        <h2 class="sub-header">Student Infomation</h2>

        <!-- Action Buttons -->
        <div class="actions-bar">
            <button id="btnOpenStudentModal" class="btn btn-green">+ Student</button>
            <button id="btnOpenScoreModal" class="btn btn-green">+ Score</button>
        </div>

        <!-- Notification Banner -->
        <div id="alertBanner" class="alert-banner hidden"></div>

        <!-- Student Information Table -->
        <div class="table-container">
            <table class="sis-table" id="studentTable">
                <thead>
                    <tr>
                        <th style="width: 5%;">Id</th>
                        <th style="width: 14%;">Student Id</th>
                        <th style="width: 22%;">Student Name</th>
                        <th style="width: 14%;">Subject Name</th>
                        <th style="width: 10%;">Score 1</th>
                        <th style="width: 10%;">Score 2</th>
                        <th style="width: 10%;">Credit</th>
                        <th style="width: 10%;">Grade</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Rows Loaded by JavaScript -->
                    <tr>
                        <td colspan="9" class="text-center loading-text">Loading student records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal 1: + Student -->
    <div id="studentModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Insert New Student</h3>
                <span class="close-modal" id="closeStudentModal">&times;</span>
            </div>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentCode">Student Id / Code <span class="required">*</span></label>
                    <input type="text" id="studentCode" placeholder="e.g. 2007A10" required maxlength="20">
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" placeholder="e.g. Nguyen Van A" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="e.g. Ha Noi" maxlength="255">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelStudentBtn">Cancel</button>
                    <button type="submit" class="btn btn-green">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: + Score -->
    <div id="scoreModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Insert Subject Score for Student</h3>
                <span class="close-modal" id="closeScoreModal">&times;</span>
            </div>
            <form id="scoreForm">
                <div class="form-group">
                    <label for="selectStudent">Select Student <span class="required">*</span></label>
                    <select id="selectStudent" required>
                        <option value="">-- Choose Student --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="selectSubject">Select Subject <span class="required">*</span></label>
                    <select id="selectSubject" required>
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group col-half">
                        <label for="score1">Score 1 (Weight 0.3) <span class="required">*</span></label>
                        <input type="number" id="score1" step="0.1" min="0" max="10" placeholder="0.0 - 10.0" required>
                    </div>
                    <div class="form-group col-half">
                        <label for="score2">Score 2 (Weight 0.7) <span class="required">*</span></label>
                        <input type="number" id="score2" step="0.1" min="0" max="10" placeholder="0.0 - 10.0" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelScoreBtn">Cancel</button>
                    <button type="submit" class="btn btn-green">Save Score</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
